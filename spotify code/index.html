<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>spotify</title>
    <link rel="stylesheet" href="style.css">
    <link rel="reset" href="reset.css">
</head>
<body>
    <header>
      <div class="top_function">
        <div class="main_logo">
          <img src="../spotify img/spotify.png" alt="mainLogo">
        </div>
        <div class="top_btn">
          <btn>프리미엄</btn>
          <btn>지원</btn>
          <btn>다운로드하기</btn>
          <p>|</p>
          <btn>가입하기</btn>
          <btn>로그인하기</btn>
        </div>
      </div> 
    </header>
    <div class="main_text">
      <div class="pink_bar"></div>
      <div>
        <img src="../spotify img/background.png" alt="background_img" class="background_img">
        <div class="TxT">
          <h1 class="title">제한 없이 감상하세요. ₩0에 1<br>개월 동안 Premium 개인 요금<br>제를 이용해보세요.</h1>
          <h3 class="sub_text">이후에는 ₩10,900(부가세 별도)/월이 부과됩니다. 언제든 해지 가능합니다.</h3>
        </div>  
        <div class="two_btn">
          <button class="start_btn">시작하기</button>
          <button class="fee_btn">모든 요금제 보기</button>
        </div>
      </div>
      
      

    </div>
   
</body>
</html>
