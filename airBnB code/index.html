<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air BnB</title>
    <link rel="stylesheet" href="style.css">
    <link rel="reset" href="reset.css">
</head>
<body>
    <header>
      <div class="logo">
        <img src="../airbnb picture/282216.webp" alt="main_logo">
      </div>
      <div class="choice_input">
        <button class="lodging_btn">숙소</button>
        <button class="exp_btn">체험</button>
        <div class="form-container">
          <!-- 여행지 섹션 -->
          <div class="input-section">
            <label for="destination">여행지</label>
            <input type="text" id="destination" placeholder="여행지 검색">
          </div>
      
          <!-- 체크인 섹션 -->
          <div class="input-section">
            <label for="checkin">체크인</label>
            <input type="date" id="checkin" placeholder="날짜 추가">
          </div>
      
          <!-- 체크아웃 섹션 -->
          <div class="input-section">
            <label for="checkout">체크아웃</label>
            <input type="date" id="checkout" placeholder="날짜 추가">
          </div>
      
          <!-- 여행자 섹션 -->
          <div class="input-section">
            <label for="traveler">여행자</label>
            <input type="text" id="traveler" placeholder="게스트 추가">
            <button class="search-btn" id="searchButton">
              <i>🔍</i> 검색
            </button>
          </div>
        </div>
      </div>
 
      
      
    </header>
    <p>여기에 내용을 작성하세요.</p>
</body>
</html>
