<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>넷플릭스</title>
    <link rel="stylesheet" href="style.css"> <!-- 스타일시트 연결 -->
    <link rel="resetsheet" href="reset.css"> <!-- 리셋시트 연결 -->
</head>
<body>
    <header>
        <!-- 상단 바 로고부터 로그인버튼 -->

        <!-- 왼쪽 로고 -->
         <div>
            <!-- 넷플릭스 로고  -->
             <img class="main_logo" src="../netflex picture/netflix_logo.png" alt="netflex logo">
         </div>

         <!-- 오른쪽 언어 셀렉트 박스 및 로그인 버튼 -->

        
          <div>
             <!-- 언어 셀렉트 버튼 -->
            <select class="language_select_box">
                <option value="한국어">한국어</option>
                <option value="English">English</option>
            </select>
            
            <!-- 로그인 버튼 -->
            <a class="login_button" href="login.html">
                    로그인   
            </a>
          </div>
    </header>
    
    <section>
        <!-- 섹션 설명 텍스트 -->
        <div class="section-description">
            <h1>영화, 시리즈 등을 무제한으로 </h1>
            <h2>
                5,500원으로 시작하세요. 멤버십은 언제든지 해지 가능합니다.<br>
                <br>
                시청할 준비가 되셨나요? 멤버십을 등록하거나 재시작하려면 이메일 주소를<br>
                입력하세요.
            </h2>
         </div>
         <!-- 이메일 입력란 및 로그인 버튼 -->
         <div class="email-input-container">
            <input type="email" placeholder="이메일 주소" class="email_input">
            <!-- 시작하기 버튼 -->
            <button class="start_button">시작하기&nbsp;></button>

         </div>

         <!-- 새로 추가할 박스 -->
         <div class="promo-box">
            <div class="promo-text">
                <h3>5,500원이면 만날 수 있는 넷플릭스.</h3>
                <p>몇 개의 중간 광고와 함께 요금도 절약하고 넷플릭스도 즐겨보세요.</p>
            </div>
            <a href="#" class="promo-button">자세히 알아보기</a>
        </div>

        <!-- 영화 슬라이더 -->
        <div class="movie-slider">
            <h2>지금 뜨는 콘텐츠</h2>
            <div class="slider-container">
                <!-- 슬라이더 항목들 (영화 리스트) -->
                <div class="slide">
                    <img class="1st_pic" src="../netflex picture/1st.webp" alt="1위 영화">
                </div>
                <div class="slide">
                    <img class="2nd_pic" src="../netflex picture/2nd.webp" alt="2위 영화">
                </div>
                <div class="slide">
                    <img class="3rd_pic" src="../netflex picture/3rd.webp" alt="3위 영화">
                </div>
                <div class="slide">
                    <img class="4th_pic" src="../netflex picture/4th.webp" alt="4위 영화">
                </div>
                <div class="slide">
                    <img class="5th_pic" src="../netflex picture/5th.webp" alt="5위 영화">
                </div>
                <div class="slide">
                    <img class="6th_pic" src="../netflex picture/6th.webp" alt="6위 영화">
                </div>
                <div class="slide">
                    <img class="7th_pic" src="../netflex picture/7th.webp" alt="7위 영화">
                </div>
                <div class="slide">
                    <img class="8th_pic" src="../netflex picture/8th.webp" alt="8위 영화">
                </div>
                <div class="slide">
                    <img class="9th_pic" src="../netflex picture/9th.webp" alt="9위 영화">
                </div>
                <div class="slide">
                    <img class="10th_pic" src="../netflex picture/10th.webp" alt="10위 영화">
                </div>
            </div>
        </div>

    </section>

    
    


</body>
</html>
